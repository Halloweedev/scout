name: Apply multi-pane consistency fix

on:
  push:
    branches: [main]
    paths:
      - scripts/fix_multipane_sort.py
      - .github/workflows/apply-multipane-sort.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix_multipane_sort.py
      - run: git diff --check
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Keep sort order consistent across panes"
          git push
