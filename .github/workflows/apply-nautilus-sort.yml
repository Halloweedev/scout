name: Apply Nautilus sort controls

on:
  push:
    branches: [main]
    paths:
      - scripts/apply_nautilus_sort_menu.py
      - .github/workflows/apply-nautilus-sort.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/apply_nautilus_sort_menu.py
      - run: git diff --check
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Add Nautilus-style sort controls"
          git push
