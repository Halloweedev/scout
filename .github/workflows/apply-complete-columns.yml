name: Apply complete Columns view

on:
  push:
    branches: [main]
    paths:
      - scripts/apply_complete_columns.py
      - .github/workflows/apply-complete-columns.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/apply_complete_columns.py
      - run: git diff --check
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/components/ColumnBrowser.tsx src/components/Icon.tsx src/lib/quick-look.ts src/index.tsx src/column-browser.css
          git diff --cached --quiet && exit 0
          git commit -m "Implement complete Finder-style Columns view"
          git push
