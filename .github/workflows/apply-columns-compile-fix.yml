name: Apply Columns compile fix

on:
  push:
    branches: [main]
    paths:
      - scripts/fix_columns_compile.py
      - .github/workflows/apply-columns-compile-fix.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix_columns_compile.py
      - run: git diff --check
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Fix Columns cross-platform path regexes"
          git push
