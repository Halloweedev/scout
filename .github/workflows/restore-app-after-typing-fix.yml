name: Restore App after typing fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/restore-app-after-typing-fix.yml

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore and fix App
        run: |
          git show 38e62f4aaee45c5392025e887abdf64ffc48ef12:src/App.tsx > src/App.tsx
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/App.tsx')
          s = p.read_text()
          old = 'title: loaded.displayName,'
          if s.count(old) != 1:
              raise SystemExit(f'expected one typing fix target, found {s.count(old)}')
          p.write_text(s.replace(old, 'title: loaded.title,', 1))
          PY
          git diff --check
      - name: Commit restored App
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git commit -m "Fix new-tab title typing"
          git push
