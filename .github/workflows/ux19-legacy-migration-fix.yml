name: UX19 legacy migration fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Prepare UX19 legacy location migration fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Preserve legacy startup migration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/App.tsx')
          source = path.read_text()
          old = '''function readSavedSessionLayout(): SavedSessionLayout | null {
            try {
              const raw = localStorage.getItem(SESSION_LAYOUT_KEY);
              if (!raw) return null;
              const value = JSON.parse(raw) as Partial<SavedSessionLayout>;
          '''
          new = '''function readSavedSessionLayout(): SavedSessionLayout | null {
            try {
              const raw = localStorage.getItem(SESSION_LAYOUT_KEY);
              if (!raw) {
                const legacyPath = localStorage.getItem(LAST_LOCATION_KEY)?.trim();
                return legacyPath ? { panePaths: [legacyPath], activePaneIndex: 0, updatedAt: 0 } : null;
              }
              const value = JSON.parse(raw) as Partial<SavedSessionLayout>;
          '''
          if source.count(old) != 1:
              raise SystemExit(f'expected one session layout reader, found {source.count(old)}')
          path.write_text(source.replace(old, new, 1))

          doc = Path('docs/UX19_TAB_SESSION_CONTINUITY.md')
          text = doc.read_text()
          marker = '- Invalid pane paths are dropped; if the saved active pane disappeared, the nearest surviving pane becomes active.\n'
          addition = marker + '- The older `scout.session.last-location.v1` value remains a migration fallback when no pane-layout snapshot exists yet.\n'
          if text.count(marker) != 1:
              raise SystemExit('UX19 migration doc anchor missing')
          doc.write_text(text.replace(marker, addition, 1))
          PY

          git rm .github/workflows/ux19-legacy-migration-fix.yml
          git diff --check
          pnpm install --frozen-lockfile
          pnpm build
          git config user.name "Nicolas"
          git config user.email "halloweed@tutamail.com"
          git add -A
          git commit -m "Preserve UX19 legacy location migration"
          git push origin HEAD:main
