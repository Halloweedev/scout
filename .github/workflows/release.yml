name: Release candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version label for the candidate, e.g. 0.1.0-alpha.1"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: scout-release-candidate
  cancel-in-progress: false

jobs:
  build:
    name: Release candidate (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux
            bundle: deb
          - os: macos-latest
            label: macos
            bundle: dmg
          - os: windows-latest
            label: windows
            bundle: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build release bundle
        run: pnpm tauri build --bundles ${{ matrix.bundle }}
      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: scout-${{ inputs.version }}-${{ matrix.label }}
          path: src-tauri/target/release/bundle
          if-no-files-found: error
          retention-days: 14
