name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: scout-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  desktop:
    name: Desktop + bundle (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux
            bundle: deb
          - os: macos-latest
            label: macOS
            bundle: dmg
          - os: windows-latest
            label: Windows
            bundle: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb xdotool imagemagick
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cargo check --locked --manifest-path src-tauri/Cargo.toml
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build installable bundle
        run: pnpm tauri build --debug --bundles ${{ matrix.bundle }}
      - name: Run real app runtime smoke
        if: runner.os == 'Linux'
        run: bash scripts/runtime_smoke_linux.sh
      - name: Upload runtime smoke evidence
        if: runner.os == 'Linux' && always()
        uses: actions/upload-artifact@v4
        with:
          name: scout-Linux-runtime-smoke
          path: |
            ${{ runner.temp }}/scout-runtime-smoke.png
            ${{ runner.temp }}/scout-runtime.log
          if-no-files-found: warn
          retention-days: 7
      - name: Upload installable bundle
        uses: actions/upload-artifact@v4
        with:
          name: scout-${{ matrix.label }}-debug-bundle
          path: src-tauri/target/debug/bundle
          if-no-files-found: error
          retention-days: 7
