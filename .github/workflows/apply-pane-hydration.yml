name: Apply pane hydration

on:
  push:
    branches: [main]
    paths:
      - scripts/apply_pane_hydration.py
      - .github/workflows/apply-pane-hydration.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/apply_pane_hydration.py
      - run: git diff --check
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Hydrate metadata for added and restored panes"
          git push
