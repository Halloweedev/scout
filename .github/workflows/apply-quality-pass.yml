name: Apply Scout quality pass

on:
  push:
    branches: [main]
    paths:
      - scripts/quality_pass.py
      - .github/workflows/apply-quality-pass.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/quality_pass.py
      - run: git diff --check
      - name: Commit quality pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/components/ColumnBrowser.tsx src-tauri/src/preview.rs
          git diff --cached --quiet && exit 0
          git commit -m "Harden Scout navigation and preview UX"
          git push
