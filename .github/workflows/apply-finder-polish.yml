name: Apply Finder polish

on:
  push:
    branches: [main]
    paths:
      - scripts/apply_finder_nautilus_polish.py
      - .github/workflows/apply-finder-polish.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch current App without replacing user refactor
        run: python3 scripts/apply_finder_nautilus_polish.py
      - name: Verify patch formatting
        run: git diff --check
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Polish Finder views and responsive navigation"
          git push
