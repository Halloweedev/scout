name: Apply Columns runtime polish

on:
  push:
    branches: [main]
    paths:
      - scripts/apply_columns_runtime_polish.py
      - .github/workflows/apply-columns-runtime-polish.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/apply_columns_runtime_polish.py
      - run: git diff --check
      - name: Commit source polish
        run: |
          git checkout -- .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/components/ColumnBrowser.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Polish complete Columns navigation"
          git push
