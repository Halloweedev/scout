name: Apply cross-platform locations fix

on:
  push:
    branches: [main]
    paths:
      - scripts/fix_special_directories.py
      - .github/workflows/apply-special-directories.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix_special_directories.py
      - run: git diff --check
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/fs.rs
          git diff --cached --quiet && exit 0
          git commit -m "Fix cross-platform special locations"
          git push
