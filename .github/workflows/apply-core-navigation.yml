name: Apply core file navigation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-core-navigation.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/add_core_file_navigation.py
      - run: git diff --check
      - name: Commit navigation UX
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/components/ColumnBrowser.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Add core file navigation UX"
          git push
