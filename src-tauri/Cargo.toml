[package]
name = "scout"
version = "0.1.0"
description = "The open-source power tool for your files."
authors = ["Scout contributors"]
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/Halloweedev/scout"

[lib]
name = "scout_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
dirs = "6.0.0"
trash = "5.2.6"
open = "5.4.2"
